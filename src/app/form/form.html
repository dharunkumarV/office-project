<h2>{{ editIndex === -1 ? 'Add Student' : 'Edit Student' }}</h2>

<label>
  Name:
  <input type="text" [formControl]="studentForm.controls.name">
</label>

<label>
  Age:
  <input type="number" [formControl]="studentForm.controls.age">
</label>

<label>
  Email:
  <input type="text" [formControl]="studentForm.controls.email">
</label>

<label>
  City:
  <input type="text" [formControl]="studentForm.controls.city">
</label>

<p style="color: red;" *ngIf="errorMessage">{{ errorMessage }}</p>

<button (click)="submit()">{{ editIndex === -1 ? 'Submit' : 'Update' }}</button>
