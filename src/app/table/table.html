<h2>Student Table</h2>


<button (click)="add()">
Add Student
</button>
<br><br>

<table border="1">

<tr>

<th>Name</th>
<th>Age</th>
<th>Email</th>
<th>City</th>
<th>Edit</th>
<th>Delete</th>

</tr>
<tr *ngFor="let item of students; let i = index">

<td>{{item.name}}</td>

<td>{{item.age}}</td>

<td>{{item.email}}</td>

<td>{{item.city}}</td>

<td><button (click)="edit(i)">Edit</button></td>
<td><button (click)="delete(i)">Delete</button></td>

</tr>

</table>
